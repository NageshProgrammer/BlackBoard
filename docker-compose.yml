version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: boardcollab_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: boardcollab
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: boardcollab_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: boardcollab_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/boardcollab
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: supersecret_boardcollab_jwt_key_2026
      CLIENT_URL: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: boardcollab_client
    restart: always
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_WS_URL: http://localhost:5000
    depends_on:
      - server

volumes:
  mongo_data:
  redis_data:
